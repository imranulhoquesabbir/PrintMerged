name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:       # "Run workflow" button

# Needed to publish the Release that the program's auto update reads.
permissions:
  contents: write

# Two quick pushes: only the newest one is built, so "latest release" is always the newest code.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      # Tell the program which build it is and where to look for newer ones (used by Updates > Auto update).
      - name: Stamp build info
        shell: python
        run: |
          open("buildinfo.py", "w").write('BUILD = ${{ github.run_number }}\nREPO = "${{ github.repository }}"\nCOMMIT = "${{ github.sha }}"\n')

      - name: Updater test
        run: python test_updater.py

      # Folder build: nothing is unpacked on start, so the 35 MB helper costs no start-up time. (If it is ever missing, the
      # program downloads it by itself the first time the internet link is switched on.)
      - name: Download cloudflared (internet link)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile bin\cloudflared.exe

      - name: Build exe
        run: >
          pyinstaller --noconsole --onedir --name PCPrint
          --add-data "static;static"
          --add-binary "bin\cloudflared.exe;bin"
          --exclude-module tkinter
          --hidden-import pystray._win32
          --hidden-import win32com.client
          --hidden-import pythoncom
          --hidden-import buildinfo
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          app.py

      # The updater downloads this zip: the CONTENT of the program folder (PCPrint.exe + _internal) at the top level.
      - name: Zip
        shell: python
        run: |
          import shutil
          shutil.make_archive("PCPrint-folder-windows", "zip", "dist/PCPrint")

      - uses: actions/upload-artifact@v4
        with:
          name: PCPrint
          path: PCPrint-folder-windows.zip

      # Publish this build as a Release: installed programs see it, tell the user, and update after the user agrees.
      # Only for the main branch. Built as a draft first so nobody sees a release before the zip is attached.
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" PCPrint-folder-windows.zip --draft --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" --notes "${NOTES:-Manual build}"
          gh release edit "$TAG" --draft=false --latest
